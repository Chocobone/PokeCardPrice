# Card-Market 개발 환경
# 사용법: Docker/ 에서 `cp .env.example .env` 후 `docker compose up -d`
name: pokecardprice

services:
  db:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pokecardprice-backend-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../src/backend:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: pokecardprice-frontend-dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      TZ: Asia/Seoul
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../src/frontend:/app
      - node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  go-mod:
  go-build:
  node-modules:
