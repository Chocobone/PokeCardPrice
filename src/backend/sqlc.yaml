# sqlc 설정. 실행: docker compose exec backend go tool sqlc generate
# 스키마는 goose 마이그레이션 디렉터리를 그대로 읽는다.
# 타입 결정 근거: mydocs/tech/db_schema.md 10절
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        # NULL 허용 컬럼은 모두 포인터(*string, *int32, *decimal.Decimal 등)로 만든다
        emit_pointers_for_null_types: true
        overrides:
          # 금액·환율: 정밀 산술이 필요해 decimal 을 쓴다 (pgx 는 sql.Scanner/Valuer 로 처리)
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          # 사용자 ID
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # 시각·날짜
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
