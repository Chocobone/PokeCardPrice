# Card-Market 개발 환경
# 사용법: Docker/ 에서 `cp .env.example .env` 후 `docker compose up -d`
name: pokecardprice

services:
  db:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pokecardprice-backend-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # DB 테스트 전용 DB. 테스트가 매번 비우므로 개발 DB와 분리한다. 없으면 테스트가 만든다.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test?sslmode=disable
      PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../src/backend:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  # 시세 수집기. backend 와 같은 이미지·소스를 쓰고 실행 대상(APP)만 다르다.
  collector:
    build: ./backend
    image: pokecardprice-backend-dev
    restart: unless-stopped
    environment:
      APP: collector
      # 다른 장비의 DB 에 적재할 때 .env 에 COLLECTOR_DATABASE_URL 을 지정한다 (scripts/collector.sh). 비우면 이 compose 의 db.
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable}
      TZ: Asia/Seoul
      # 개발 중 일정 대신 짧은 간격으로 실행하려면 .env 에 COLLECTOR_INTERVAL=30s 처럼 지정한다.
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-}
      # 카탈로그 수집 범위 (개발용, 비우면 전체). 예: CATALOG_LANGUAGES=en,ja CATALOG_SETS=sv03.5,SV5K
      CATALOG_LANGUAGES: ${CATALOG_LANGUAGES:-}
      CATALOG_SETS: ${CATALOG_SETS:-}
      CATALOG_FULL: ${CATALOG_FULL:-}
      # 해외 시세 수집 (개발용, 비우면 전체). 예: PRICES_SOURCES=fx,tcgcsv (none 이면 끔) PRICES_TCGCSV_GROUPS=23237
      # 언어·세트 범위는 CATALOG_LANGUAGES·CATALOG_SETS 를 함께 쓴다.
      PRICES_SOURCES: ${PRICES_SOURCES:-}
      PRICES_TCGCSV_GROUPS: ${PRICES_TCGCSV_GROUPS:-}
    volumes:
      - ../src/backend:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: pokecardprice-frontend-dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      TZ: Asia/Seoul
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../src/frontend:/app
      - node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  go-mod:
  go-build:
  node-modules:
